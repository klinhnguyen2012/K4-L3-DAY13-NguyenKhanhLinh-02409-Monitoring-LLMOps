alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(response_sent.latency_ms) > 3000
    duration: 5m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: student-02409
    runbook: docs/alerts.md#alert-1
  - name: ElevatedRequestErrorRate
    severity: critical
    condition: request_failed / request_received * 100 > 2
    duration: 5m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: student-02409
    runbook: docs/alerts.md#alert-2
  - name: LowRetrievalSuccess
    severity: warning
    condition: retrieval_tool_success_pct < 90
    duration: 10m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: student-02409
    runbook: docs/alerts.md#alert-3
